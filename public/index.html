<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <h1>Network Traffic Dashboard</h1>
        <p class="subtitle">Live & Historical Monitoring</p>
    </header>

    <main id="dashboard">
        <section class="dashboard-section">
            <h2 class="section-main-title">Live Traffic</h2>
            <div id="realtime-container" class="grid-layout">
                <!-- Real-time blocks injected here -->
            </div>
        </section>

        <section class="dashboard-section">
            <h2 class="section-main-title">Historical Records (Last 5 Days)</h2>
            <div id="history-container" class="grid-layout">
                <!-- History blocks injected here -->
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
