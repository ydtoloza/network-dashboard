<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d1117">
    <title>Network Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="logo.png" alt="Logo" class="main-logo">
            <div>
                <h1>Network Dashboard</h1>
                <p class="subtitle">Live & Historical Monitoring</p>
            </div>
        </div>
    </header>

    <main id="dashboard">
        <section class="dashboard-section">
            <h2 class="section-main-title">Summary</h2>
            <div id="summary-container" class="summary-grid">
                <!-- Summary cards injected here -->
            </div>
        </section>

        <section class="dashboard-section">
            <h2 class="section-main-title">Live Traffic</h2>
            <div id="realtime-container" class="grid-layout">
                <!-- Real-time blocks injected here -->
            </div>
        </section>

        <section class="dashboard-section">
            <h2 class="section-main-title">Historical Records</h2>
            <div id="range-tabs" class="range-tabs">
                <!-- Range tabs injected here -->
            </div>
            <div id="history-container" class="grid-layout">
                <!-- History blocks injected here -->
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
